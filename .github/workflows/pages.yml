# Roadmap P4-04 + P3-07: deploy the download site and the version manifest
# to GitHub Pages. Editing website/ or manifest/ and pushing IS publishing.
# NOTE: Pages on a free-plan repo requires the repo to be PUBLIC — this
# deploy fails until the repo visibility is flipped (first-run checklist).
name: Deploy Website

on:
  push:
    branches: [main, 'claude/**']
    paths: ['website/**', 'manifest/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/manifest
          cp -r website/* _site/
          cp manifest/axo-manifest.json _site/manifest/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
