# Roadmap P4-05: tag client-vX.Y.Z -> build jar with JDK 21 -> GitHub Release
# with jar + SHA1SUMS.txt (the sha1 goes into manifest/axo-manifest.json,
# see docs/releasing.md).
name: Client Release

on:
  push:
    tags: ['client-v*']
  # Manual dispatch: used when the release is cut from an environment that
  # cannot push tags (e.g. a remote session); creates the tag via the release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. client-v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - name: Generate SHA1 checksums
        run: sha1sum build/libs/*.jar | tee build/libs/SHA1SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            client/build/libs/*.jar
            client/build/libs/SHA1SUMS.txt
          generate_release_notes: true
