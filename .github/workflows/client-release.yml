# Roadmap P4-05: tag client-vX.Y.Z -> build jar with JDK 21 -> GitHub Release
# with jar + SHA1SUMS.txt (the sha1 goes into manifest/axo-manifest.json,
# see docs/releasing.md).
name: Client Release

on:
  push:
    tags: ['client-v*']
  # Manual dispatch: used when the release is cut from an environment that
  # cannot push tags (e.g. a remote session); creates the tag via the release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. client-v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The jar is named from mod_version, so a mismatched tag produces
      # axoclient-0.1.0.jar hanging off tag client-v0.2.0 — and then a manifest
      # entry whose URL and version disagree. Fail early instead.
      - name: Tag must match mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/client-v}"
          mod=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$tag" != "$mod" ]; then
            echo "::error::Tag client-v$tag does not match client/gradle.properties mod_version $mod"
            echo "Bump mod_version to $tag (or retag to client-v$mod) and re-run."
            exit 1
          fi
          echo "Tag and mod_version agree on $mod"
      - run: ./gradlew build --no-daemon
      - name: Generate SHA1 checksums
        run: sha1sum build/libs/*.jar | tee build/libs/SHA1SUMS.txt
      # gh CLI with retries: GitHub's releases API returns intermittent 503s;
      # resume with upload-only if the release was created but assets failed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # Also covers leftover drafts with this tag: upload fresh assets,
              # then publish (a draft stays invisible until --draft=false).
              gh release upload "$TAG" build/libs/*.jar build/libs/SHA1SUMS.txt \
                --clobber --repo "$GITHUB_REPOSITORY" \
                && gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY" \
                && exit 0
            else
              gh release create "$TAG" build/libs/*.jar build/libs/SHA1SUMS.txt \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "$TAG" --generate-notes && exit 0
            fi
            echo "attempt $i failed - retrying in 30s"
            sleep 30
          done
          echo "release failed after 5 attempts (likely GitHub API outage)"
          exit 1
