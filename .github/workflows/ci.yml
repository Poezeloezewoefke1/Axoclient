name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  manifest:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Strict validation: the first release is live, no placeholders allowed.
      - run: node manifest/validate.mjs

  launcher:
    name: Launcher typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client:
    # This job IS roadmap task P1-01's signal: it resolves the Fabric toolchain
    # with real network access. If the pins in client/gradle.properties are
    # stale, this goes red — fix the pins per https://fabricmc.net/develop.
    name: Client build (Fabric 1.21.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: fabric-api versions for 1.21.11 (pin helper)
        run: curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*1\.21\.11[^<]*</version>' | tail -5 || true
      - name: loom versions (pin helper)
        run: curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*</version>' | grep -v SNAPSHOT | tail -8 || true
      - name: modrinth pins for 1.21.11 (manifest helper)
        run: |
          for slug in fabric-api sodium lithium; do
            echo "=== $slug ==="
            curl -s "https://api.modrinth.com/v2/project/$slug/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D" \
              | jq -c '.[0] | {id, version_number, file: (.files[0] | {url, sha1: .hashes.sha1, size})}' || true
          done
      - run: ./gradlew build --no-daemon
      - name: Dump cape/skin mappings (diagnostic)
        if: always()
        run: |
          JAR=$(find ~/.gradle -name "*.jar" 2>/dev/null | while read j; do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class"; then echo "$j"; break; fi
          done)
          echo "MC jar: $JAR"
          if [ -n "$JAR" ]; then
            echo "===== ClientAsset.ResourceTexture ====="
            javap -p -classpath "$JAR" 'net.minecraft.core.ClientAsset$ResourceTexture' 2>/dev/null | head -30
            echo "===== Identifier factory methods ====="
            javap -p -classpath "$JAR" net.minecraft.resources.Identifier 2>/dev/null | grep -iE "public static|withPath|withDefaultNamespace" | head -20
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: axoclient-jar
          path: client/build/libs/*.jar
