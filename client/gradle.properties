# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric toolchain for Minecraft 1.21.11.
# VERIFY these pins against https://fabricmc.net/develop before the first build
# (roadmap task P1-01) — they were written without network access to Fabric's
# servers and may need a patch-level bump.
minecraft_version=1.21.11
loader_version=0.17.3
loom_version=1.11-SNAPSHOT
# If this pin is stale, the CI client job prints the available 1.21.11
# versions in its "fabric-api versions" step — copy the newest from there.
fabric_api_version=0.135.0+1.21.11

# Mod properties
mod_version=0.1.0
maven_group=dev.axoclient
archives_base_name=axoclient
